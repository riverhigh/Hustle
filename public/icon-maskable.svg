<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg_mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold_mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald_mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow_mask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full bleed background for Android squircle cropping -->
  <rect width="512" height="512" fill="url(#bg_mask)"/>

  <!-- Scaled content inside 80% safe zone (center 256, 256, scaled down by 0.78) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Skyline silhouette background -->
    <g fill="#1e293b" opacity="0.65">
      <rect x="80" y="240" width="45" height="150" rx="4"/>
      <rect x="135" y="200" width="50" height="190" rx="4"/>
      <rect x="195" y="170" width="55" height="220" rx="4"/>
      <rect x="260" y="210" width="50" height="180" rx="4"/>
      <rect x="320" y="180" width="55" height="210" rx="4"/>
      <rect x="385" y="230" width="45" height="160" rx="4"/>
    </g>

    <!-- Foreground towers -->
    <rect x="110" y="220" width="60" height="170" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="3"/>
    <path d="M 220 390 L 220 160 L 256 110 L 292 160 L 292 390 Z" fill="#0f172a" stroke="url(#gold_mask)" stroke-width="3.5"/>
    <line x1="256" y1="70" x2="256" y2="110" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="70" r="7" fill="#fbbf24" filter="url(#glow_mask)"/>

    <rect x="240" y="175" width="32" height="18" rx="2" fill="#fbbf24" opacity="0.85"/>
    <rect x="240" y="210" width="32" height="18" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="240" y="245" width="32" height="18" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="240" y="280" width="32" height="18" rx="2" fill="#a855f7" opacity="0.8"/>
    <rect x="240" y="315" width="32" height="18" rx="2" fill="#34d399" opacity="0.85"/>

    <rect x="340" y="210" width="62" height="180" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="3"/>

    <!-- Growth Curve -->
    <path d="M 85 350 Q 180 340, 240 270 T 425 130" fill="none" stroke="url(#emerald_mask)" stroke-width="9" stroke-linecap="round" filter="url(#glow_mask)"/>
    <path d="M 405 125 L 435 125 L 435 155" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gold Coin -->
    <g transform="translate(256, 385)">
      <circle cx="0" cy="0" r="48" fill="#1e1b4b" stroke="url(#gold_mask)" stroke-width="5" filter="url(#glow_mask)"/>
      <circle cx="0" cy="0" r="40" fill="url(#gold_mask)"/>
      <text x="0" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#0f172a" text-anchor="middle">$</text>
    </g>
  </g>
</svg>
