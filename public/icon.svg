<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#312e81" stroke-width="4" opacity="0.6"/>

  <!-- Radial Glow Behind Skyline -->
  <circle cx="256" cy="270" r="170" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>

  <!-- City Skyline Silhouette (Background Layer) -->
  <g fill="#1e293b" opacity="0.6">
    <rect x="80" y="240" width="45" height="150" rx="4"/>
    <rect x="135" y="200" width="50" height="190" rx="4"/>
    <rect x="195" y="170" width="55" height="220" rx="4"/>
    <rect x="260" y="210" width="50" height="180" rx="4"/>
    <rect x="320" y="180" width="55" height="210" rx="4"/>
    <rect x="385" y="230" width="45" height="160" rx="4"/>
  </g>

  <!-- Foreground Modern Towers with Neon Windows -->
  <g>
    <!-- Tower Left -->
    <rect x="110" y="220" width="60" height="170" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="2.5"/>
    <line x1="125" y1="240" x2="125" y2="360" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="155" y1="240" x2="155" y2="360" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- Tower Center (Empire Spire) -->
    <path d="M 220 390 L 220 160 L 256 110 L 292 160 L 292 390 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="3"/>
    <line x1="256" y1="70" x2="256" y2="110" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Spire beacon glow -->
    <circle cx="256" cy="70" r="6" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Center Tower Windows -->
    <rect x="240" y="175" width="32" height="18" rx="2" fill="#fbbf24" opacity="0.85"/>
    <rect x="240" y="210" width="32" height="18" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="240" y="245" width="32" height="18" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="240" y="280" width="32" height="18" rx="2" fill="#a855f7" opacity="0.8"/>
    <rect x="240" y="315" width="32" height="18" rx="2" fill="#34d399" opacity="0.85"/>

    <!-- Tower Right -->
    <rect x="340" y="210" width="62" height="180" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="2.5"/>
    <line x1="358" y1="230" x2="358" y2="360" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="382" y1="230" x2="382" y2="360" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 6"/>
  </g>

  <!-- Financial Ascending Growth Arrow (Hustle to Wealth) -->
  <path d="M 85 350 Q 180 340, 240 270 T 425 130" fill="none" stroke="url(#emerald)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 405 125 L 435 125 L 435 155" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Golden Currency Badge in Bottom Foreground -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="46" fill="#1e1b4b" stroke="url(#gold)" stroke-width="5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="38" fill="url(#gold)"/>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#0f172a" text-anchor="middle">$</text>
  </g>

  <!-- App Title Label for Splash Context -->
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#e2e8f0" letter-spacing="4" text-anchor="middle">HUSTLE &amp; EMPIRE</text>
</svg>
